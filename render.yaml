# Render Blueprint for the Nexus frontend.
#
# IMPORTANT: this file does NOT retroactively configure a service that was created by hand in
# the dashboard. An existing manual service keeps using its dashboard settings, so the Build
# Command must still be set there once (Settings > Build & Deploy). This file makes the config
# reproducible, and a service created from a Blueprint picks it up automatically.
#
# The build output (frontend/dist) is gitignored and must be produced here — an empty build
# command is why "Publish directory frontend/dist does not exist!" kept failing the deploy.
services:
  - type: web
    runtime: static
    name: nexus
    # npm ci needs frontend/package-lock.json, which is committed.
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # Vite 8 requires node ^20.19.0 || >=22.12.0; .node-version pins this too.
      - key: NODE_VERSION
        value: "24"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
