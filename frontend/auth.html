<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050914" />
  <title>Nexus — Sign in</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./auth.css" />
</head>
<body>
  <main class="auth-shell">
    <a class="auth-brand" href="./">Nexus<sup>®</sup></a>
    <section class="auth-card" aria-labelledby="auth-title">
      <p class="auth-eyebrow">Your money, private by default.</p>
      <h1 id="auth-title">Welcome back.</h1>
      <p class="auth-copy">Sign in with the email and password on your Nexus account.</p>
      <div class="auth-status" role="status" aria-live="polite" data-auth-status hidden></div>
      <form class="auth-form" data-login-form novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="username" inputmode="email" spellcheck="false" required />
          <p class="field__error" data-error-for="email" hidden></p>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
          <p class="field__error" data-error-for="password" hidden></p>
        </div>
        <button class="auth-submit" type="submit" data-login>Sign in</button>
      </form>
      <a class="auth-secondary" href="./signup.html" data-signup-link>Create an account</a>
      <p class="auth-note">Your password goes straight to Amazon Cognito over TLS. Nexus never stores it.</p>
    </section>
  </main>
  <script type="module" src="./auth-cognito.js"></script>
</body>
</html>
