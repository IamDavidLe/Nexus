<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050914" />
  <title>Nexus — Sign in</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./auth.css" />
</head>
<body>
  <main class="auth-shell">
    <a class="auth-brand" href="./">Nexus<sup>®</sup></a>
    <section class="auth-card" aria-labelledby="auth-title">
      <p class="auth-eyebrow">Your money, private by default.</p>
      <h1 id="auth-title">Welcome back.</h1>
      <p class="auth-copy">Sign in securely with your Nexus account.</p>
      <div class="auth-status" role="status" aria-live="polite" data-auth-status hidden></div>
      <div class="auth-form" data-login-form>
        <button class="auth-submit" type="button" data-login>Login</button>
        <button class="auth-secondary" type="button" data-signup>Sign up</button>
      </div>
      <p class="auth-note">You’ll continue to Amazon Cognito’s Hosted UI. Nexus never sees your password.</p>
    </section>
  </main>
  <script type="module" src="./auth-cognito.js"></script>
</body>
</html>
